# ==========================================================================
# scenarios/08-vulnerable-web-app-ssrf-rce/manifest.yaml
# DEFECT: a deliberately vulnerable web app (command injection -> RCE, and SSRF)
# used as an INITIAL-ACCESS foothold that chains into the other scenarios
# (steal the SA token -> RBAC; SSRF to cloud metadata -> Scenario 09 on AKS).
# The app is pure-stdlib Python shipped via ConfigMap (no image build needed).
# Namespace: webapp
# ==========================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: webapp
  labels:
    lab: k8s-sec-lab
    scenario: "08-vulnerable-web-app-ssrf-rce"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vuln-app-src
  namespace: webapp
data:
  app.py: |
    #!/usr/bin/env python3
    # INTENTIONALLY VULNERABLE demo app. Do not reuse.
    import subprocess, urllib.request
    from http.server import BaseHTTPRequestHandler, HTTPServer
    from urllib.parse import urlparse, parse_qs

    class H(BaseHTTPRequestHandler):
        def _send(self, code, body):
            self.send_response(code); self.send_header("Content-Type","text/plain")
            self.end_headers(); self.wfile.write(body.encode(errors="replace"))
        def do_GET(self):
            u = urlparse(self.path); q = parse_qs(u.query)
            if u.path == "/":
                self._send(200, "endpoints: /ping?host=  /fetch?url=\n"); return
            if u.path == "/ping":
                host = q.get("host", ["127.0.0.1"])[0]
                # VULN: command injection -- host is concatenated into a shell.
                out = subprocess.run("ping -c1 " + host, shell=True,
                                     capture_output=True, text=True, timeout=10)
                self._send(200, out.stdout + out.stderr); return
            if u.path == "/fetch":
                url = q.get("url", [""])[0]
                # VULN: SSRF -- server fetches any URL the caller supplies.
                try:
                    headers = {}
                    target = urlparse(url)
                    if target.hostname == "169.254.169.254" and q.get("metadata", [""])[0] == "true":
                        headers["Metadata"] = "true"
                    request = urllib.request.Request(url, headers=headers)
                    with urllib.request.urlopen(request, timeout=5) as r:
                        self._send(200, r.read().decode(errors="replace"))
                except Exception as e:
                    self._send(500, "fetch error: %s\n" % e); return
            else:
                self._send(404, "not found\n")
        def log_message(self, *a): pass

    if __name__ == "__main__":
        HTTPServer(("0.0.0.0", 8080), H).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vuln-web
  namespace: webapp
  labels: { app: vuln-web }
spec:
  replicas: 1
  selector: { matchLabels: { app: vuln-web } }
  template:
    metadata:
      labels: { app: vuln-web, lab: k8s-sec-lab }
    spec:
      # Automount token on purpose: RCE -> steal token -> API access (chain).
      automountServiceAccountToken: true
      containers:
        - name: web
          image: python:3.12-alpine@sha256:4c47124a8391cb7a9f571164147d154777cf012a4ece5f86097130d7a4478111
          imagePullPolicy: IfNotPresent
          command: ["python3", "/app/app.py"]
          ports: [{ containerPort: 8080 }]
          volumeMounts:
            - { name: src, mountPath: /app }
          resources:
            requests: { cpu: "25m", memory: "48Mi" }
            limits:   { cpu: "500m", memory: "256Mi" }
      volumes:
        - name: src
          configMap: { name: vuln-app-src }
---
apiVersion: v1
kind: Service
metadata:
  name: vuln-web
  namespace: webapp
spec:
  # ClusterIP only -- reach it via kubectl port-forward. NEVER expose publicly.
  type: ClusterIP
  selector: { app: vuln-web }
  ports: [{ port: 80, targetPort: 8080 }]
