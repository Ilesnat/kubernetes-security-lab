# ==========================================================================
# cluster/kind/kind-config.yaml
# Multi-node kind cluster: 1 control-plane + 2 workers.
# Multiple nodes give realistic node/kubelet boundaries for container-escape
# and lateral-movement scenarios. To run single-node on a low-RAM machine,
# set KIND_NODES=single in .env (create.ps1 then uses the inline single config).
#
# API server audit logging is enabled here. The apiserver runs as a static pod,
# so BOTH the policy file and the log directory must be mounted into it via
# apiServer.extraVolumes (not just referenced by extraArgs) or the apiserver
# will fail to start. extraMounts places the policy file on the node first.
# ==========================================================================
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: k8s-sec-lab
nodes:
  - role: control-plane
    # Expose apiserver only on loopback (default). Do NOT bind to 0.0.0.0.
    kubeadmConfigPatches:
      - |
        kind: ClusterConfiguration
        apiServer:
          extraArgs:
            audit-log-path: /var/log/kubernetes/kube-apiserver-audit.log
            audit-log-maxage: "7"
            audit-log-maxbackup: "3"
            audit-policy-file: /etc/kubernetes/audit-policy.yaml
          extraVolumes:
            - name: audit-policy
              hostPath: /etc/kubernetes/audit-policy.yaml
              mountPath: /etc/kubernetes/audit-policy.yaml
              readOnly: true
              pathType: File
            - name: audit-log
              hostPath: /var/log/kubernetes
              mountPath: /var/log/kubernetes
              readOnly: false
              pathType: DirectoryOrCreate
    extraMounts:
      - hostPath: ./tooling/audit/audit-policy.yaml
        containerPath: /etc/kubernetes/audit-policy.yaml
        readOnly: true
  - role: worker
  - role: worker
